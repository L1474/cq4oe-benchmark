{% extends "base.html" %}
{% block title %}Run Records · CQ4OE Evaluator{% endblock %}
{% block content %}
<header class="page-heading">
  <div><p class="eyebrow">Evaluation history</p><h1>Run Records</h1></div>
  <a class="button primary" href="/runs/new">New run</a>
</header>
<section class="records-toolbar" aria-label="Record filters">
  <label>Agent<select id="filter-agent"><option value="">All Agents</option>{% for agent in agents %}<option value="{{ agent.id }}">{{ agent.name }}</option>{% endfor %}</select></label>
  <label>Model<select id="filter-model"><option value="">All models</option></select></label>
  <label>Task<select id="filter-task"><option value="">All tasks</option>{% for task in tasks %}<option value="{{ task }}">{{ task|upper }}</option>{% endfor %}</select></label>
  <label>Domain<select id="filter-domain"><option value="">All domains</option>{% for domain in domains %}<option value="{{ domain.slug }}">{{ domain.name }}</option>{% endfor %}</select></label>
  <label>State<select id="filter-status"><option value="">All states</option>{% for state in ["draft", "queued", "running", "completed", "partial", "failed"] %}<option value="{{ state }}">{{ state|title }}</option>{% endfor %}</select></label>
  <label>From<input type="date" id="filter-from"></label>
  <label>To<input type="date" id="filter-to"></label>
  <label class="toggle-label"><input type="checkbox" id="trend-toggle" checked> Show trend</label>
  <button type="button" class="button" id="clear-record-filters">Clear</button>
</section>
<div class="records-selection"><span id="record-count" class="muted">Loading records…</span><button type="button" class="button" id="compare-selected" disabled>Compare selected</button></div>
<div class="table-scroll">
  <table class="data-table records-table">
    <thead><tr><th>Select</th><th>Created</th><th>Agent / model</th><th>Task / domain</th><th>State</th><th>Metrics</th><th>Trend</th></tr></thead>
    <tbody id="records-body"><tr><td colspan="7">Loading records…</td></tr></tbody>
  </table>
</div>
<nav class="pagination" aria-label="Record pages"><button class="button" id="records-prev" disabled>Previous</button><span id="records-page">Page 1</span><button class="button" id="records-next" disabled>Next</button></nav>
<script>window.recordTasks = {{ tasks|tojson }};</script>
{% endblock %}
