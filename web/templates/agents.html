{% extends "base.html" %}
{% block title %}Agents · CQ4OE Evaluator{% endblock %}
{% block content %}
<section class="page-heading">
  <div><p class="eyebrow">Configuration</p><h1>Agents</h1></div>
  <button class="button primary" type="button" id="new-agent">＋ New Agent</button>
</section>
<form id="agent-form" class="form-panel" hidden>
  <div class="form-heading"><h2 id="agent-form-title">New Agent</h2><button class="icon-button" type="button" id="cancel-agent" aria-label="Close">×</button></div>
  <input type="hidden" id="agent-id">
  <label>Agent name<input id="agent-name" name="name" required maxlength="120"></label>
  <label>Description<input id="agent-description" name="description" maxlength="300"></label>
  <div class="form-actions"><button class="button" type="button" id="cancel-agent-secondary">Cancel</button><button class="button primary" type="submit">Save Agent</button></div>
</form>
<div id="agent-error" class="notice error" role="alert" hidden></div>
<div id="agents-list" class="agent-list" aria-live="polite"><p class="muted">Loading Agents…</p></div>
{% endblock %}
